openapi: 3.1.0
info:
  title: Banh Mi Cho POS - Hub API Contract Starter
  version: 0.1.0-draft
  description: Local pilot implemented subset for Nest Store Hub. Bank 503 until verified merchant integration; further contract work remains.
servers:
  - url: http://localhost:4400
    description: Hub localhost during POC only; real LAN trust and origin policy must be validated.
security:
  - bearerAuth: []
paths:

  /v1/auth/device/pair:
    post:
      operationId: pairStaffPhone
      summary: Redeem owner-issued single-use code over trusted LAN HTTPS
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code, device_name], properties: {code: {type: string}, device_name: {type: string}}}}}}
      responses:
        '201': {description: Opaque device token (returned only once)}
        '401': {description: Invalid, expired or already redeemed pairing code}
  /v1/owner/device-pairing-codes:
    post:
      operationId: issueSingleUseStaffPairCode
      responses:
        '201': {description: Eight-character one-time code expiring after five minutes}
        '403': {description: Owner role required}
  /v1/owner/devices:
    get:
      operationId: listPairedStaffDevices
      responses:
        '200': {description: Paired, last-seen and revoked devices}
  /v1/owner/devices/{deviceId}/revoke:
    post:
      operationId: revokeStaffPhone
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: {type: string}
      responses:
        '201': {description: Device authorization revoked immediately}
  /v1/health:
    get:
      operationId: localHealth
      security: []
      responses:
        '200': {description: Local pilot readiness (bank and printing remain flagged)}
  /v1/providers/sepay/webhook:
    post:
      operationId: verifiedSePayWebhook
      summary: Raw HMAC-SHA256 webhook endpoint, merchant setup required
      security: []
      parameters:
        - name: x-sepay-signature
          in: header
          required: true
          schema: {type: string}
        - name: x-sepay-timestamp
          in: header
          required: true
          schema: {type: string}
      responses:
        '201': {description: Webhook durably classified as verified or exception}
        '401': {description: Invalid signature or timestamp}
  /v1/sync/settlements:
    get:
      operationId: pullVerifiedBankSettlements
      summary: Signed authenticated cloud-to-Store Hub bank settlement inbox
      security: []
      parameters:
        - name: after
          in: query
          required: true
          schema: {type: string}
        - name: x-bmc-store
          in: header
          required: true
          schema: {type: string}
        - name: x-bmc-timestamp
          in: header
          required: true
          schema: {type: string}
        - name: x-bmc-signature
          in: header
          required: true
          schema: {type: string}
      responses:
        '200': {description: Signed cloud settlement envelope}
        '401': {description: Invalid store, signature or time}
  /v1/auth/logout:
    post:
      operationId: remoteOwnerLogout
      summary: Cloud Owner revokes the current remote session
      responses:
        '201': {description: Token revoked}
        '401': {description: Missing, expired or revoked token}
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [user_id, pin], properties: {user_id: {type: string}, pin: {type: string}}}}}}
      responses:
        '201': {description: Actor-scoped session token}
  /v1/orders/history:
    get:
      operationId: pagedOrderHistory
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200': {description: Cursor page with items and next_cursor}
  /v1/orders/{orderId}/refunds/cash:
    post:
      operationId: refundCash
      summary: Cashier-only full cash refund, audited and idempotent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [shift_id, reason], properties: {shift_id: {type: string}, reason: {type: string}}}}}}
      responses:
        '201': {description: Cash refund and drawer movement committed}
        '409': {description: Not refundable or cash balance insufficient}
  /v1/internal/bank-events:
    post:
      operationId: ingestTrustedBankBridgeEvent
      summary: Bank bridge only; requires signed timestamp and trusted provider verification
      security: []
      parameters:
        - name: x-bmc-timestamp
          in: header
          required: true
          schema: {type: string}
        - name: x-bmc-signature
          in: header
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [provider_tx_id, reference, bank_code, account_number, amount_vnd, direction], properties: {provider_tx_id: {type: string}, reference: {type: string}, bank_code: {type: string}, account_number: {type: string}, amount_vnd: { $ref: '#/components/schemas/MoneyVnd'}, direction: {type: string, enum: [CREDIT]}}}}}}
      responses:
        '201': {description: Confirmed, exception or deduplicated bridge event}
        '401': {description: HMAC/timestamp rejected}
  /v1/owner/bank-exceptions:
    get:
      operationId: listBankExceptions
      summary: Owner-only unmatched, wrong amount/destination and late bank transfers
      responses:
        '200': {description: Latest 100 bank event exceptions}
  /v1/orders/{orderId}/void:
    post:
      operationId: voidUnpaidOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string}}}}}}
      responses:
        '201': {description: Unpaid order canceled with audit event}
  /v1/cash-shifts/current:
    get:
      operationId: currentShift
      responses:
        '200': {description: Open shift or null}
  /v1/cash-shifts/open:
    post:
      operationId: openShift
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [opening_float_vnd], properties: {opening_float_vnd: { $ref: '#/components/schemas/MoneyVnd'}}}}}}
      responses:
        '201': {description: Shift now opened by cashier}
  /v1/cash-shifts/{shiftId}/movements:
    post:
      operationId: cashMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: shiftId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind, amount_vnd, reason], properties: {kind: {type: string, enum: [ADD, WITHDRAW, EXPENSE]}, amount_vnd: { $ref: '#/components/schemas/MoneyVnd'}, reason: {type: string}}}}}}
      responses:
        '201': {description: Updated expected shift cash}
  /v1/cash-shifts/{shiftId}/close:
    post:
      operationId: closeShift
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: shiftId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [counted_cash_vnd], properties: {counted_cash_vnd: { $ref: '#/components/schemas/MoneyVnd'}, reason: {type: string}}}}}}
      responses:
        '201': {description: Immutable shift closure with variance}
  /v1/orders/{orderId}/receipts:
    get:
      operationId: listReceiptCopies
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Copies and physical print send status}
  /v1/receipt-copies/{copyId}/reprint:
    post:
      operationId: requestReprint
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: copyId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string}}}}}}
      responses:
        '201': {description: Audited reprint request, no second payment}
  /v1/owner/dashboard:
    get:
      operationId: ownerDashboard
      responses:
        '200': {description: Verified local cash sales only, no bank provider attached}
  /v1/owner/products:
    get:
      operationId: ownerProducts
      responses:
        '200': {description: Owner catalog and prices}
    post:
      operationId: ownerCreateProduct
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, category, price_vnd], properties: {name: {type: string}, category: {type: string}, price_vnd: { $ref: '#/components/schemas/MoneyVnd'}}}}}}
      responses:
        '201': {description: Product created}
  /v1/owner/products/{productId}:
    patch:
      operationId: ownerUpdateProduct
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: productId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, price_vnd, is_active], properties: {name: {type: string}, price_vnd: { $ref: '#/components/schemas/MoneyVnd'}, is_active: {type: boolean}}}}}}
      responses:
        '200': {description: Updated product with price version increment}
  /v1/owner/employees:
    get:
      operationId: ownerListEmployees
      responses:
        '200': {description: Employees including active status}
    post:
      operationId: ownerAddEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id, name, role, pin], properties: {id: {type: string}, name: {type: string}, role: {type: string, enum: [STAFF, CASHIER]}, pin: {type: string}}}}}}
      responses:
        '201': {description: Employee created with hashed PIN}
  /v1/owner/employees/{employeeId}:
    patch:
      operationId: ownerSetEmployeeActive
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: employeeId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}}
      responses:
        '200': {description: Employee activated or revoked}
  /v1/orders/{orderId}/payments/bank-intent:
    post:
      operationId: bankPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '503': {description: Bank provider not connected; no captured money and no QR}

  /v1/catalog:
    get:
      operationId: listCatalog
      summary: Return current local signed catalog snapshot
      responses:
        '200':
          description: Current catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v1/orders:
    post:
      operationId: createOrder
      summary: Commit one order from authenticated staff
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Persisted order, not proof of payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Catalog version changed or concurrency conflict
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /v1/orders/{orderId}/payments/cash:
    post:
      operationId: captureCash
      description: Cashier only, local authoritative transaction, derive change on backend
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashCaptureRequest'
      responses:
        '200':
          description: Settled cash and receipt intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCaptureResult'
        '409':
          description: Wrong shift, already paid or insufficient amount
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    MoneyVnd:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Exact VND integer, never floating point
    PaymentMethod:
      type: string
      enum: [CASH, BANK, MOMO, MIXED]
    Catalog:
      type: object
      required: [version, products, enabled_payment_methods]
      properties:
        version: { type: integer, minimum: 1 }
        enabled_payment_methods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        products:
          type: array
          items:
            type: object
            required: [id, name, price_vnd]
            properties:
              id: { type: string }
              name: { type: string }
              price_vnd: { $ref: '#/components/schemas/MoneyVnd' }
    CreateOrderItem:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: string }
        qty: { type: integer, minimum: 1, maximum: 100 }
        note: { type: string, maxLength: 500 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [catalog_version, requested_payment_method, items]
      properties:
        catalog_version: { type: integer, minimum: 1 }
        requested_payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        items:
          type: array
          minItems: 1
          maxItems: 60
          items: { $ref: '#/components/schemas/CreateOrderItem' }
        note: { type: string, maxLength: 1000 }
    Order:
      type: object
      required: [order_id, display_code, status, payment_status, requested_payment_method, total_vnd, version]
      properties:
        order_id: { type: string, format: uuid }
        display_code: { type: string }
        status: { type: string, enum: [COMMITTED, VOIDED] }
        payment_status: { type: string, enum: [UNPAID, PARTIAL, PAID, PARTIALLY_REFUNDED, REFUNDED] }
        requested_payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        total_vnd: { $ref: '#/components/schemas/MoneyVnd' }
        version: { type: integer, minimum: 1 }
    CashCaptureRequest:
      type: object
      additionalProperties: false
      required: [shift_id, cash_tendered_vnd, expected_order_version]
      properties:
        shift_id: { type: string }
        cash_tendered_vnd: { $ref: '#/components/schemas/MoneyVnd' }
        expected_order_version: { type: integer, minimum: 1 }
    CashCaptureResult:
      type: object
      required: [payment_id, cash_tendered_vnd, cash_change_vnd, cash_net_vnd, payment_status, receipt_batch_id]
      properties:
        payment_id: { type: string }
        cash_tendered_vnd: { $ref: '#/components/schemas/MoneyVnd' }
        cash_change_vnd: { $ref: '#/components/schemas/MoneyVnd' }
        cash_net_vnd: { $ref: '#/components/schemas/MoneyVnd' }
        payment_status: { type: string, enum: [PAID] }
        receipt_batch_id: { type: string }
