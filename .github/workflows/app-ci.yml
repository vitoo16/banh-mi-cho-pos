name: App typecheck and build
on:
  pull_request:
    paths: ['apps/**','packages/**','tests/**','scripts/store-backup.mjs','scripts/check-backup-freshness.mjs','package.json','.github/workflows/app-ci.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run test:domain
      - run: npm run test:integration
      - run: npm run test:perf:http
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-http-perf-smoke
          path: artifacts/perf/hub-http-smoke.json
          if-no-files-found: ignore
          retention-days: 14
