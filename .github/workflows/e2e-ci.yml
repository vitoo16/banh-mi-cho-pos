# Keep main/production-history verification intact; cancel only obsolete revisions of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: Senior E2E Test Suite
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/seed-e2e.mjs'
      - 'scripts/e2e-playwright-hub.mjs'
      - 'package.json'
      - 'playwright.e2e.config.ts'
      - '.github/workflows/e2e-ci.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Keep all browser projects; the installer still fetches any browser revision missing from the cache.
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: bmc-playwright-${{ runner.os }}-${{ hashFiles('package.json', 'playwright.config.ts', 'playwright.e2e.config.ts') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Senior E2E Real Hub API, Burst Load and Browser Suites
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            artifacts/qa/
          if-no-files-found: ignore
          retention-days: 14

