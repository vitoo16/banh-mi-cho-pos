name: SQLite history composite index benchmark
on:
  pull_request:
    paths:
      - 'apps/store-hub/src/db.ts'
      - 'apps/store-hub/src/service.ts'
      - 'tests/history-index.test.mjs'
      - 'package.json'
      - '.github/workflows/history-index-ci.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  history-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @bmc/contracts
      - run: npm run build -w @bmc/store-hub
      - run: npm run test:perf:history-index
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load02-history-index-comparison
          path: artifacts/perf/load02-history-index-comparison.json
          if-no-files-found: ignore
          retention-days: 14
