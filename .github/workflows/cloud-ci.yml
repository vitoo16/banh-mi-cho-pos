name: Cloud Postgres contract and sync tests
on:
  pull_request:
    paths: ['apps/cloud-api/**','apps/store-hub/src/sync.ts','apps/store-hub/src/db.ts','tests/cloud.test.mjs','.github/workflows/cloud-ci.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmc_test
          POSTGRES_PASSWORD: bmc_test_password
          POSTGRES_DB: bmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmc_test -d bmc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bmc_test:bmc_test_password@127.0.0.1:5432/bmc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @bmc/contracts
      - run: npm run build -w @bmc/cloud-api
      - run: node --test tests/cloud.test.mjs
