# Give each main/dispatch run its own group; only superseded revisions of the same PR can cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: Windows SQLite backup and restore smoke
on:
  pull_request:
    paths:
      - 'scripts/store-backup.mjs'
      - 'scripts/windows/run-store-backup.ps1'
      - 'scripts/check-backup-freshness.mjs'
      - 'tests/restore.test.mjs'
      - 'tests/windows-backup-job.test.mjs'
      - 'tests/backup-freshness.test.mjs'
      - 'tests/restore-process-rehearsal.test.mjs'
      - 'apps/store-hub/**'
      - 'packages/contracts/**'
      - 'package.json'
      - '.github/workflows/backup-restore-windows.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/store-backup.mjs'
      - 'scripts/check-backup-freshness.mjs'
      - 'scripts/windows/run-store-backup.ps1'
      - 'tests/restore.test.mjs'
      - 'tests/backup-freshness.test.mjs'
      - 'tests/windows-backup-job.test.mjs'
      - 'tests/restore-process-rehearsal.test.mjs'
      - 'apps/store-hub/**'
      - 'packages/contracts/**'
      - 'package.json'
      - '.github/workflows/backup-restore-windows.yml'
permissions:
  contents: read
jobs:
  windows-restore:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @bmc/contracts
      - run: npm run build -w @bmc/store-hub
      - run: node --test tests/backup-freshness.test.mjs tests/restore.test.mjs tests/restore-process-rehearsal.test.mjs tests/windows-backup-job.test.mjs
