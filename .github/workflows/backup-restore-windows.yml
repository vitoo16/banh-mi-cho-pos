name: Windows SQLite backup and restore smoke
# Local-first: keep this workflow only for manual fallback.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-restore:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @bmc/contracts
      - run: npm run build -w @bmc/store-hub
      - run: node --test tests/backup-freshness.test.mjs tests/restore.test.mjs tests/restore-process-rehearsal.test.mjs tests/windows-backup-job.test.mjs
