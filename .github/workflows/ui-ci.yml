name: POS and Owner responsive browser E2E
# Local-first: keep this workflow only for manual fallback.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build shared typed API client
        run: npm run build -w @bmc/contracts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive UI tests with mocked Hub API
        run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-candidates
          path: test-results/**/owner-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-pos-visual-candidates
          path: test-results/**/pos-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-responsive-failures
          path: test-results/
          retention-days: 7
