# Give each main/dispatch run its own group; only superseded revisions of the same PR can cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: POS and Owner responsive browser E2E
on:
  pull_request:
    paths:
      - 'apps/web-pos/**'
      - 'apps/web-owner/**'
      - 'packages/contracts/**'
      - 'tests/ui/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web-pos/**'
      - 'apps/web-owner/**'
      - 'packages/contracts/**'
      - 'tests/ui/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build shared typed API client
        run: npm run build -w @bmc/contracts
      # Keep all browser projects; the installer still fetches any browser revision missing from the cache.
      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: bmc-playwright-${{ runner.os }}-${{ hashFiles('package.json', 'playwright.config.ts', 'playwright.e2e.config.ts') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive UI tests with mocked Hub API
        run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-candidates
          path: test-results/**/owner-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-pos-visual-candidates
          path: test-results/**/pos-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-responsive-failures
          path: test-results/
          retention-days: 7
